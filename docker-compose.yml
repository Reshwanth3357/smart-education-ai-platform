services:
  api:
    build: .
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./data:/app/data"]
    depends_on: [postgres, redis]
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: sakshamai, POSTGRES_USER: sakshamai, POSTGRES_PASSWORD: sakshamai }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  n8n:
    image: n8nio/n8n:latest
    environment: { N8N_BASIC_AUTH_ACTIVE: "false", N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY} }
    ports: ["5678:5678"]
volumes: { postgres_data: {} }
